  tiles:
    '0':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries c = avg(process_cpu_seconds_total)

        | fieldsAdd `CPU usage (%)` = c[] / 60 / 4 * 100

        | fieldsRemove c

        '
      title: HA Process CPU (% of 4 cores)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '1':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries r = avg(process_resident_memory_bytes)

        | fieldsAdd `Memory usage (%)` = r[] / (4 * 1024 * 1024 * 1024) * 100

        | fieldsRemove r

        '
      title: HA Process Memory (% of 4 GB)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '10':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(homeassistant_sensor_state), by:{friendly_name}

        | fieldsAdd raw = arrayLast(val)

        | fieldsAdd n = toLong(round(raw))

        | fieldsAdd v0 = if(friendly_name == "Active power limitation raw", if(n==170,"On",else:if(n==85,"Off",else:if(n==65535,"Not
        available (0xFFFF)",else:"Unknown"))))

        | fieldsAdd v1 = if(friendly_name == "APL shutdown at zero raw", if(n==170,"On",else:if(n==85,"Off",else:if(n==65535,"Not
        available (0xFFFF)",else:"Unknown"))))

        | fieldsAdd v2 = if(friendly_name == "Backup mode raw", if(n==170,"On",else:if(n==85,"Off",else:"Unknown")))

        | fieldsAdd v3 = if(friendly_name == "Battery forced charge discharge cmd raw", if(n==204,"Stop (default)",else:if(n==170,"Forced
        charge",else:if(n==187,"Forced discharge",else:"Unknown"))))

        | fieldsAdd v4 = if(friendly_name == "EMS mode selection raw", if(n==0,"Self-consumption (default)",else:if(n==2,"Forced
        mode",else:if(n==3,"External EMS",else:if(n==4,"VPP",else:"Unknown")))))

        | fieldsAdd v5 = if(friendly_name == "Export power limit mode raw", if(n==170,"On",else:if(n==85,"Off",else:"Unknown")))

        | fieldsAdd v6 = if(friendly_name == "Load adjustment mode enable raw", if(n==170,"On",else:if(n==85,"Off",else:"Unknown")))

        | fieldsAdd v7 = if(friendly_name == "Load adjustment mode selection raw", if(n==0,"Timing",else:if(n==1,"On/Off",else:if(n==2,"Power
        optimization",else:if(n==3,"Disabled",else:"Unknown")))))

        | fieldsAdd v8 = if(friendly_name == "Power Flow Status", if(n==0,"Idle",else:replacePattern(concat(if((n/1)%2==1,"PV
        generating, ",else:""),if((n/2)%2==1,"Battery charging, ",else:""),if((n/4)%2==1,"Battery discharging, ",else:""),if((n/8)%2==1,"Positive
        load power, ",else:""),if((n/16)%2==1,"Exporting, ",else:""),if((n/32)%2==1,"Importing, ",else:""),if((n/128)%2==1,"Negative
        load power, ",else:"")), "'', '' EOS", "")))

        | fieldsAdd v9 = if(friendly_name == "Running state raw", if(n==0,"Running",else:if(n==1,"Stop",else:if(n==2,"Key
        stop",else:if(n==4,"Emergency stop",else:if(n==8,"Standby",else:if(n==16,"Initial standby",else:if(n==20,"Microgrid
        operation",else:if(n==32,"Starting",else:if(n==64,"Running",else:if(n==65,"Off-grid charge",else:if(n==128,"Derating
        running",else:if(n==256,"Fault",else:if(n==512,"Update failed",else:if(n==1024,"Running (maintain mode)",else:if(n==2048,"Running
        (forced mode)",else:if(n==4096,"Running (off-grid)",else:if(n==4369,"Uninitialized",else:if(n==16384,"Running (external
        EMS)",else:if(n==32768,"Stop",else:"Unknown"))))))))))))))))))))

        | fieldsAdd v10 = if(friendly_name == "Sungrow device type code", if(n==3584,"SH5.0RT",else:if(n==3585,"SH6.0RT",else:if(n==3586,"SH8.0RT",else:if(n==3587,"SH10RT",else:if(n==3592,"SH5.0RT-V122",else:if(n==3593,"SH6.0RT-V122",else:if(n==3594,"SH8.0RT-V122",else:if(n==3595,"SH10RT-V122",else:if(n==3596,"SH5.0RT-V112",else:if(n==3597,"SH6.0RT-V112",else:if(n==3598,"SH8.0RT-V112",else:if(n==3599,"SH10RT-V112",else:if(n==3600,"SH5.0RT-20",else:if(n==3601,"SH6.0RT-20",else:if(n==3602,"SH8.0RT-20",else:if(n==3603,"SH10RT-20",else:if(n==3616,"SH5T",else:if(n==3617,"SH6T",else:if(n==3618,"SH8T",else:if(n==3619,"SH10T",else:if(n==3620,"SH12T",else:if(n==3621,"SH15T",else:if(n==3622,"SH20T",else:if(n==3624,"SH25T",else:"Unknown
        model")))))))))))))))))))))))))

        | fieldsAdd v11 = if(friendly_name == "Sungrow Protocol Version", concat("V", toString((n/16777216)%256), ".", toString((n/65536)%256),
        ".", toString((n/256)%256), ".", toString(n%256)))

        | fieldsAdd v12 = if(friendly_name == "Power factor", toString(round(raw, decimals:2)))

        | fieldsAdd Value = coalesce(v0, v1, v2, v3, v4, v5, v6, v7, v8, v9, v10, v11, v12, toString(n))

        | fieldsAdd Sensor = if(friendly_name == "Active power limitation raw", "Active power limitation", else: if(friendly_name
        == "APL shutdown at zero raw", "APL shutdown at zero", else: if(friendly_name == "Backup mode raw", "Backup mode",
        else: if(friendly_name == "Battery forced charge discharge cmd raw", "Battery forced charge/discharge command", else:
        if(friendly_name == "EMS mode selection raw", "EMS mode", else: if(friendly_name == "Export power limit mode raw",
        "Export power limit", else: if(friendly_name == "Load adjustment mode enable raw", "Load adjustment", else: if(friendly_name
        == "Load adjustment mode selection raw", "Load adjustment mode", else: if(friendly_name == "Power Flow Status", "Power
        flow", else: if(friendly_name == "Running state raw", "Running state", else: if(friendly_name == "Sungrow device type
        code", "Inverter model", else: if(friendly_name == "Sungrow Protocol Version", "Protocol version", else: if(friendly_name
        == "Power factor", "Power factor", else: friendly_name)))))))))))))

        | fieldsAdd Raw = if(friendly_name == "Power factor", "", else: toString(n))

        | fields Sensor, Value, Raw

        | sort Sensor asc

        '
      title: Inverter state (decoded)
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '11':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries val = avg(homeassistant_sensor_timestamp_seconds), by:{friendly_name}

