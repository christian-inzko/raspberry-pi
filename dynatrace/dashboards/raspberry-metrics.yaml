  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    '0':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  Outdoor = avg(thermometer.temperature, filter: {model == \"AmbientWeather-TX8300\"}),\n  Indoor\
        \ = avg(thermometer.temperature, filter: {model == \"Hideki-TS04\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Temperature (Indoor & Outdoor)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: true
    '1':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  Outdoor = avg(thermometer.humidity, filter: {model == \"AmbientWeather-TX8300\"}),\n  Indoor\
        \ = avg(thermometer.humidity, filter: {model == \"Hideki-TS04\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Humidity (Indoor & Outdoor)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: true
    '10':
      coloring:
        colorRules:
        - colorMode: custom-color
          comparator: '>'
          customColor:
            Default: '#2f6862'
          field: count
          value: -1
        - colorMode: custom-color
          comparator: '>'
          customColor:
            Default: '#eea53c'
          field: count
          value: 0
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch logs

        | filter dt.openpipeline.source == "/api/v2/otlp/v1/logs"

        | filter contains(content, "WARNING")

        | summarize count = count()

        '
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Pipeline Log Warnings (24h)
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: warnings
          recordField: count
    '11':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch logs

        | filter dt.openpipeline.source == "/api/v2/otlp/v1/logs"

        | sort timestamp desc

        | limit 100

        | fields timestamp, log.file.name, content

        '
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Recent Pipeline Logs
      type: data
      visualization: table
      visualizationSettings:
        autoSelectVisualization: false
    '2':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  total = sum(system.cpu.time),\n  idle = sum(system.cpu.time, filter: {state == \"idle\"})\n\
        }\n| fieldsAdd `CPU usage (%)` = (1 - idle[] / total[]) * 100\n| fieldsRemove total, idle\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: CPU Usage (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '3':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  used = avg(system.memory.usage, filter: {state == \"used\"}),\n  total = sum(system.memory.usage,\
        \ rollup: avg)\n}\n| fieldsAdd `Memory usage (%)` = used[] / total[] * 100\n| fieldsRemove used, total\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Memory Usage (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '4':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  used = avg(system.filesystem.usage, filter: {state == \"used\" and mountpoint == \"/\"}),\n\
        \  free = avg(system.filesystem.usage, filter: {state == \"free\" and mountpoint == \"/\"})\n}\n| fieldsAdd `Disk\
        \ usage (%)` = used[] / (used[] + free[]) * 100\n| fieldsRemove used, free\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Disk Usage / (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '5':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  rx = sum(system.network.io, filter: {direction == \"receive\" and device != \"lo\" and device\
        \ != \"docker0\"}),\n  tx = sum(system.network.io, filter: {direction == \"transmit\" and device != \"lo\" and device\
        \ != \"docker0\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Network I/O
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    '6':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  errors = sum(system.network.errors, filter: {device != \"lo\" and device != \"docker0\"}),\n\
        \  dropped = sum(system.network.dropped, filter: {device != \"lo\" and device != \"docker0\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Network Errors & Drops
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    '7':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  read = sum(system.disk.io, filter: {direction == \"read\" and device == \"mmcblk0\"}),\n  write\
        \ = sum(system.disk.io, filter: {direction == \"write\" and device == \"mmcblk0\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Disk I/O
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    '8':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  busy_time = avg(system.disk.io_time, filter: {device == \"mmcblk0\"})\n}\n"
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Disk I/O Time
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    '9':
      coloring:
        colorRules:
        - colorMode: custom-color
          comparator: '>'
          customColor:
            Default: '#2f6862'
          field: count
          value: -1
        - colorMode: custom-color
          comparator: '>'
          customColor:
            Default: '#c62239'
          field: count
          value: 0
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'fetch logs

        | filter dt.openpipeline.source == "/api/v2/otlp/v1/logs"

        | filter contains(content, "ERROR")

        | summarize count = count()

        '
      querySettings:
        defaultSamplingRatio: 10
        defaultScanLimitGbytes: 500
        enableSampling: false
        maxResultMegaBytes: 1
        maxResultRecords: 1000
      title: Pipeline Log Errors (24h)
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: errors
          recordField: count
  variables: []
  version: 21
