content:
  annotations: []
  importedWithCode: false
  layouts:
    "0":
      h: 8
      w: 24
      x: 0
      "y": 0
    "4":
      h: 6
      w: 24
      x: 0
      "y": 8
    "1":
      h: 6
      w: 24
      x: 0
      "y": 14
    "2":
      h: 4
      w: 12
      x: 0
      "y": 20
    "3":
      h: 4
      w: 12
      x: 12
      "y": 20
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: now()-24h
        to: now()
  tiles:
    "0":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        timeseries {
          pv_yield = avg(sungrow_total_dc_power),
          grid = avg(sungrow_meter_active_power),
          battery = avg(sungrow_battery_power),
          load = avg(sungrow_load_power)
        }
      title: Power (W)
      type: data
      visualization: areaChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    "4":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        timeseries {
          temperature_C = avg(thermometer.temperature, filter: {model == "Nexus-TH"}),
          humidity_pct = avg(thermometer.humidity, filter: {model == "Nexus-TH"})
        }
      title: Outdoor Temperature (°C) & Humidity (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    "1":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        timeseries avg(sungrow_battery_level)
      title: Battery Level (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    "2":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        timeseries soc = avg(sungrow_battery_level)
        | fieldsAdd current = arrayLast(soc)
        | fields current
      title: Battery Level
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: '% charged'
          recordField: current
    "3":
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: |
        timeseries temp = avg(sungrow_inverter_temperature)
        | fieldsAdd current = arrayLast(temp)
        | fields current
      title: Inverter Temperature
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: °C
          recordField: current
  variables: []
  version: 21
