id: 751301dc-6ef3-4af6-a9a0-efc7131d5ba1
name: Sungrow metrics
type: dashboard
content:
  annotations: []
  importedWithCode: false
  layouts:
    '0':
      h: 8
      w: 24
      x: 0
      y: 0
    '1':
      h: 6
      w: 24
      x: 0
      y: 14
    '2':
      h: 4
      w: 12
      x: 0
      y: 20
    '3':
      h: 4
      w: 12
      x: 12
      y: 20
    '4':
      h: 6
      w: 24
      x: 0
      y: 8
  settings:
    defaultTimeframe:
      enabled: true
      value:
        from: '@d'
        to: now()
  tiles:
    '0':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  `Solar production` = avg(sungrow_total_dc_power),\n  `House consumption` = avg(sungrow_load_power),\n\
        \  `Grid power` = avg(sungrow_meter_active_power),\n  `Battery power` = avg(sungrow_battery_power)\n}\n| fieldsAdd\
        \ `Battery power` = `Battery power`[] * -1\n"
      title: Power flow (W) — + export/charge, − import/discharge
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
    '1':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries avg(sungrow_battery_level)

        '
      title: Battery Level (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
    '2':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries soc = avg(sungrow_battery_level)

        | fieldsAdd current = arrayLast(soc)

        | fields current

        '
      title: Battery Level
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: '% charged'
          recordField: current
    '3':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: 'timeseries temp = avg(sungrow_inverter_temperature)

        | fieldsAdd current = arrayLast(temp)

        | fields current

        '
      title: Inverter Temperature
      type: data
      visualization: singleValue
      visualizationSettings:
        autoSelectVisualization: false
        singleValue:
          label: °C
          recordField: current
    '4':
      davis:
        davisVisualization:
          isAvailable: true
        enabled: false
      query: "timeseries {\n  outdoor_temperature_C = avg(thermometer.temperature, filter: {model == \"AmbientWeather-TX8300\"\
        }),\n  outdoor_humidity_pct = avg(thermometer.humidity, filter: {model == \"AmbientWeather-TX8300\"})\n}\n"
      title: Outdoor Temperature (°C) & Humidity (%)
      type: data
      visualization: lineChart
      visualizationSettings:
        autoSelectVisualization: false
        chartSettings:
          legend:
            position: bottom
  variables: []
  version: 21
