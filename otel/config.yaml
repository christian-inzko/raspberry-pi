receivers:
  host_metrics:
    collection_interval: 60s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
        exclude_mount_points:
          mount_points: [/dev, /dev/shm, /run, /run/lock, /sys, /proc]
          match_type: strict
        exclude_fs_types:
          fs_types: [tmpfs, devtmpfs, sysfs, proc, cgroup, cgroup2]
          match_type: strict
      network:
      load:
      process:
        mute_process_exe_error: true
        mute_process_io_error: true
        mute_process_user_error: true

  prometheus/homeassistant:
    config:
      scrape_configs:
        - job_name: homeassistant
          scrape_interval: 60s
          scrape_timeout: 30s
          metrics_path: /api/prometheus
          authorization:
            credentials: ${env:HA_API_TOKEN}
          static_configs:
            - targets:
                - 192.168.86.211:8123

  filelog:
    include:
      - /home/pi/rtl_433_pipeline_dynatrace.log
      - /home/pi/sungrow_read.log
    start_at: end

  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
  resourcedetection:
    detectors: ["system"]
    system:
      resource_attributes:
        host.arch: {enabled: true}
        host.id: {enabled: true}
        host.name: {enabled: true}
        host.ip: {enabled: true}
        host.mac: {enabled: true}
        os.type: {enabled: true}
        os.description: {enabled: true}
  resource/homeassistant:
    attributes:
      - key: host.name
        value: "homeassistant"
        action: upsert
      - key: host.id
        value: "homeassistant-192-168-86-211"
        action: upsert
      - key: host.ip
        value: "192.168.86.211"
        action: upsert
  cumulativetodelta:
    max_staleness: 25h
  metrics_transform:
    transforms:
      - include: system.cpu.load_average.1m
        action: update
        new_name: pi.cpu.load_1m
      - include: system.cpu.load_average.5m
        action: update
        new_name: pi.cpu.load_5m
      - include: system.cpu.load_average.15m
        action: update
        new_name: pi.cpu.load_15m

exporters:
  otlp_http:
    metrics_endpoint: https://rhp60717.sprint.dynatracelabs.com/api/v2/otlp/v1/metrics
    logs_endpoint: https://rhp60717.sprint.dynatracelabs.com/api/v2/otlp/v1/logs
    traces_endpoint: https://rhp60717.sprint.dynatracelabs.com/api/v2/otlp/v1/traces
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

  # Second tenant — needs DT2_ENVIRONMENT_URL (e.g. https://abc12345.live.dynatrace.com,
  # no trailing slash) and DT2_API_TOKEN in the collector's env file. Every pipeline
  # below fans out to both exporters.
  otlp_http/tenant2:
    endpoint: ${env:DT2_ENVIRONMENT_URL}/api/v2/otlp
    headers:
      Authorization: "Api-Token ${env:DT2_API_TOKEN}"

service:
  pipelines:
    metrics/host:
      receivers: [host_metrics]
      processors: [resourcedetection, batch, cumulativetodelta, metrics_transform]
      exporters: [otlp_http, otlp_http/tenant2]
    metrics/homeassistant:
      receivers: [prometheus/homeassistant]
      processors: [resource/homeassistant, batch, cumulativetodelta]
      exporters: [otlp_http, otlp_http/tenant2]
    logs:
      receivers: [filelog]
      processors: [resourcedetection, batch]
      exporters: [otlp_http, otlp_http/tenant2]
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlp_http, otlp_http/tenant2]
