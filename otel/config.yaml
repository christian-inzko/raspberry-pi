receivers:
  host_metrics:
    collection_interval: 60s
    scrapers:
      cpu:
      memory:
      disk:
      filesystem:
        exclude_mount_points:
          mount_points: [/dev, /dev/shm, /run, /run/lock, /sys, /proc]
          match_type: strict
        exclude_fs_types:
          fs_types: [tmpfs, devtmpfs, sysfs, proc, cgroup, cgroup2]
          match_type: strict
      network:
      load:

  prometheus/homeassistant:
    config:
      scrape_configs:
        - job_name: homeassistant
          scrape_interval: 60s
          metrics_path: /api/prometheus
          authorization:
            credentials: ${env:HA_API_TOKEN}
          static_configs:
            - targets:
                - 192.168.86.211:8123

  filelog:
    include:
      - /home/pi/rtl_433_pipeline_dynatrace.log
      - /home/pi/sungrow_read.log
    start_at: end

processors:
  batch:
  resource:
    attributes:
      - key: host.name
        value: "raspberrypi"
        action: upsert
  cumulativetodelta:
  metrics_transform:
    transforms:
      - include: system.cpu.load_average.1m
        action: update
        new_name: pi.cpu.load_1m
      - include: system.cpu.load_average.5m
        action: update
        new_name: pi.cpu.load_5m
      - include: system.cpu.load_average.15m
        action: update
        new_name: pi.cpu.load_15m

exporters:
  otlp_http:
    metrics_endpoint: https://rhp60717.sprint.dynatracelabs.com/api/v2/otlp/v1/metrics
    logs_endpoint: https://rhp60717.sprint.dynatracelabs.com/api/v2/otlp/v1/logs
    headers:
      Authorization: "Api-Token ${env:DT_API_TOKEN}"

service:
  pipelines:
    metrics:
      receivers: [host_metrics, prometheus/homeassistant]
      processors: [resource, batch, cumulativetodelta, metrics_transform]
      exporters: [otlp_http]
    logs:
      receivers: [filelog]
      processors: [batch]
      exporters: [otlp_http]
